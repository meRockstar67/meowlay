<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; width: 100%; height: 100%;
  }
  #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #media-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .media-item { position: absolute; }
  .media-item img, .media-item iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="media-layer"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const socket = io();
const mediaCache = {};
let historyList = [];

// Версия состояния, которое уже есть у оверлея. При периодической проверке
// сервер отвечает коротким 'state-ok', если ничего не поменялось, — и не
// гоняет весь state каждые 15 секунд (раньше это съедало трафик Render)
let knownVersion = 0;
socket.on('connect', () => { knownVersion = 0; socket.emit('overlay-join', 0); });
socket.on('state-ok', () => {});

// Подстраховка на случай "тихо зависшего" сокета: соединение формально
// остаётся открытым, но живые события (add-media/update-media и т.д.)
// перестают доходить (сетевые затыки, спящая вкладка в OBS CEF и т.п.),
// а socket.io при этом не всегда успевает сам это заметить и переподключиться.
// Раньше это лечилось только редеплоем сервера (который рвёт все сокеты и
// заставляет оверлей переподключиться и получить полный state заново).
// Теперь просто периодически сами запрашиваем полный state — если сокет
// живой, это просто лишний no-op ресинк; если он "тихо умер", браузер это
// заметит и honoring timeout переподключится, а после реконнекта 'connect'
// и так сработает заново.
setInterval(() => {
  if (socket.connected) socket.emit('overlay-join', knownVersion);
}, 15000);

socket.on('state', (state) => {
  if (state && state.version) knownVersion = state.version;
  // Раньше здесь сцена сносилась и пересобиралась с нуля целиком — это и
  // ломало YouTube/видео: пересоздание iframe/<video> = видео стартует заново.
  // Периодический ресинк (см. overlay-join выше) прилетает каждые 15 сек,
  // поэтому видео перезапускалось примерно с той же частотой.
  // Теперь убираем только те элементы, которых реально больше нет в новом
  // состоянии (важно для Ctrl+Z и удаления), а всё остальное просто
  // обновляем на месте — createOrUpdateMedia не трогает src существующих
  // iframe/<video>, если элемент уже существует.
  const newIds = new Set(Object.keys(state.media || {}));
  for (const id in mediaCache) {
    if (!newIds.has(id)) {
      const el = document.getElementById('m-' + id);
      if (el) el.remove();
      delete mediaCache[id];
    }
  }
  Object.values(state.media).forEach(createOrUpdateMedia);
  historyList = state.history || [];
  replayHistory();
});

// --- Рисование: мазки, фигуры, текст ---
function drawSegment(d) {
  ctx.globalCompositeOperation = d.erase ? 'destination-out' : 'source-over';
  ctx.strokeStyle = d.color;
  ctx.lineWidth = d.size;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(d.x0 * canvas.width, d.y0 * canvas.height);
  ctx.lineTo(d.x1 * canvas.width, d.y1 * canvas.height);
  ctx.stroke();
}

function drawStarPath(cx, cy, outerR, innerR) {
  const spikes = 5;
  let rot = (Math.PI / 2) * 3;
  const step = Math.PI / spikes;
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    let x = cx + Math.cos(rot) * outerR;
    let y = cy + Math.sin(rot) * outerR;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerR;
    y = cy + Math.sin(rot) * innerR;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
}

function drawShape(obj) {
  const x0 = obj.x0 * canvas.width, y0 = obj.y0 * canvas.height;
  const x1 = obj.x1 * canvas.width, y1 = obj.y1 * canvas.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  if (obj.shapeType === 'rect') {
    ctx.rect(x0, y0, x1 - x0, y1 - y0);
  } else if (obj.shapeType === 'circle') {
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
    ctx.ellipse(cx, cy, rx || 1, ry || 1, 0, 0, Math.PI * 2);
  } else if (obj.shapeType === 'star') {
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const outerR = Math.min(Math.abs(x1 - x0), Math.abs(y1 - y0)) / 2;
    drawStarPath(cx, cy, outerR || 1, (outerR || 1) * 0.5);
  }
  if (obj.filled) {
    ctx.fillStyle = obj.color;
    ctx.fill();
  } else {
    ctx.strokeStyle = obj.color;
    ctx.lineWidth = obj.size;
    ctx.stroke();
  }
}

function drawText(obj) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = obj.color;
  ctx.font = obj.fontSize + 'px sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText(obj.text, obj.x * canvas.width, obj.y * canvas.height);
}

function replayHistory() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  historyList.forEach((obj) => {
    if (obj.kind === 'stroke') obj.segments.forEach(drawSegment);
    else if (obj.kind === 'shape') drawShape(obj);
    else if (obj.kind === 'text') drawText(obj);
  });
}

socket.on('draw', drawSegment);

socket.on('add-object', (obj) => {
  historyList.push(obj);
  if (obj.kind === 'shape') drawShape(obj);
  else if (obj.kind === 'text') drawText(obj);
});

socket.on('redraw-canvas', (data) => {
  historyList = data.history || [];
  replayHistory();
});

socket.on('clear-canvas', () => {
  historyList = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// --- Медиа ---
const mediaLayer = document.getElementById('media-layer');

function applyPosition(el, item) {
  el.style.left = (item.x * 100) + '%';
  el.style.top = (item.y * 100) + '%';
  el.style.width = (item.w * 100) + '%';
  el.style.height = (item.h * 100) + '%';
  const viewportEl = el.querySelector('.media-viewport');
  if (viewportEl) {
    viewportEl.style.transform = 'rotate(' + (item.rotation || 0) + 'deg)';
    viewportEl.style.transformOrigin = 'center center';
  }
  if (item.type === 'text') {
    const textDiv = el.querySelector('.text-content');
    if (textDiv) {
      const fontPx = Math.max(8, item.h * canvas.height * (item.fontScale || 0.6));
      textDiv.style.fontSize = fontPx + 'px';
      if (item.color) textDiv.style.color = item.color;
    }
  }
  applyHiddenState(el, item);
  if (item.type === 'video') {
    const videoEl = document.getElementById('vid-' + item.id);
    if (videoEl) {
      videoEl.loop = !!item.loop;
      if (item.volume !== undefined) videoEl.volume = item.volume / 100;
    }
  }
}

// Скрытие объекта — прячем визуально. Для видео дополнительно принудительно
// глушим звук, пока скрыто (даже если громкость выставлена не на 0), и
// возвращаем настоящую громкость обратно при показе — видео при этом
// продолжает играть в фоне, просто без звука и невидимо
function applyHiddenState(el, item) {
  el.style.display = item.hidden ? 'none' : '';
  el.style.opacity = (item.opacity !== undefined ? item.opacity : 100) / 100;
  // applyPosition() вызывает эту функцию на КАЖДОЕ обновление позиции (в том
  // числе десятки раз за одно перетаскивание). Раньше это на каждый такой
  // вызов слало YouTube-плееру playVideo/pauseVideo, даже если видимость не
  // менялась — из-за этого при частом перетаскивании видео иногда сбрасывалось
  // и стартовало заново. Теперь шлём команду плееру только когда hidden
  // реально изменился с прошлого раза.
  const hiddenChanged = el.dataset.hiddenState !== String(item.hidden);
  el.dataset.hiddenState = String(item.hidden);
  if (item.type === 'video') {
    const v = document.getElementById('vid-' + item.id);
    if (v) {
      if (item.hidden) {
        // Скрытое видео не играет вообще
        v.muted = true;
        if (!v.paused) v.pause();
      } else {
        v.muted = false;
        v.volume = (item.volume !== undefined ? item.volume : 0) / 100;
        if (hiddenChanged && v.paused && !v.ended) v.play().catch(() => {});
      }
    }
  } else if (item.type === 'youtube') {
    if (!hiddenChanged) return;
    const iframe = document.getElementById('yt-' + item.id);
    if (iframe && iframe.contentWindow) {
      const func = item.hidden ? 'pauseVideo' : 'playVideo';
      iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
    }
  }
}

function applyCropTransform(el, item) {
  const inner = el.querySelector('.crop-inner');
  if (!inner) return;
  // Тот же расчёт, что и в панели модератора: crop-inner держит абсолютный
  // размер контента (cropW/cropH), поэтому обрезка рамки не масштабирует
  // само содержимое — оно просто обрезается по краю рамки.
  const cropW = item.cropW || item.w;
  const cropH = item.cropH || item.h;
  inner.style.width = (item.w ? (cropW / item.w * 100) : 100) + '%';
  inner.style.height = (item.h ? (cropH / item.h * 100) : 100) + '%';
  const zoom = item.zoom || 1;
  const ox = item.offsetX || 0;
  const oy = item.offsetY || 0;
  inner.style.transform = 'scale(' + zoom + ') translate(' + (ox * 100) + '%, ' + (oy * 100) + '%)';
}

function createOrUpdateMedia(item) {
  if (item.cropW === undefined) item.cropW = item.w;
  if (item.cropH === undefined) item.cropH = item.h;
  mediaCache[item.id] = item;
  let el = document.getElementById('m-' + item.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'media-item';
    el.id = 'm-' + item.id;

    const viewport = document.createElement('div');
    viewport.className = 'media-viewport';
    viewport.style.width = '100%';
    viewport.style.height = '100%';
    viewport.style.overflow = 'hidden';
    viewport.style.position = 'relative';

    const inner = document.createElement('div');
    inner.className = 'crop-inner';
    inner.style.width = '100%';
    inner.style.height = '100%';
    inner.style.transformOrigin = 'center center';

    if (item.type === 'image') {
      inner.innerHTML = '<img src="' + item.url + '">';
    } else if (item.type === 'video') {
      inner.innerHTML = '<video id="vid-' + item.id + '" autoplay muted playsinline' +
        (item.loop ? ' loop' : '') + ' style="width:100%;height:100%;object-fit:cover;">' +
        '<source src="' + item.url + '"></video>';
    } else if (item.type === 'text') {
      const textDiv = document.createElement('div');
      textDiv.className = 'text-content';
      textDiv.textContent = item.text;
      textDiv.style.width = '100%';
      textDiv.style.height = '100%';
      textDiv.style.display = 'flex';
      textDiv.style.alignItems = 'center';
      textDiv.style.justifyContent = 'center';
      textDiv.style.color = item.color;
      textDiv.style.fontWeight = 'bold';
      textDiv.style.fontFamily = 'sans-serif';
      textDiv.style.whiteSpace = 'nowrap';
      textDiv.style.userSelect = 'none';
      inner.appendChild(textDiv);
    } else if (item.type === 'youtube') {
      const origin = encodeURIComponent(location.origin);
      inner.innerHTML = '<iframe id="yt-' + item.id + '" src="https://www.youtube.com/embed/' +
        item.videoId + '?autoplay=1&mute=1&enablejsapi=1&cc_load_policy=0&iv_load_policy=3&origin=' + origin +
        '" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    } else if (item.type === 'browser') {
      // Как Browser Source в OBS — просто произвольный сайт в iframe поверх сцены
      inner.innerHTML = '<iframe id="browser-' + item.id + '" src="' + item.url +
        '" allow="autoplay; encrypted-media; fullscreen"></iframe>';
    } else if (item.type === 'ninja') {
      inner.innerHTML = '<iframe src="' + item.url + '" allow="camera; microphone; autoplay"></iframe>';
    }

    viewport.appendChild(inner);
    el.appendChild(viewport);
    mediaLayer.appendChild(el);

    if (item.type === 'youtube') {
      // Стартуем приглушённым (браузеры почти всегда разрешают такой автоплей),
      // а затем несколько раз досылаем "включить звук" — плеер не всегда готов
      // принять команду сразу же после создания
      const sendYtCommand = (func, args) => {
        const iframe = document.getElementById('yt-' + item.id);
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*');
        }
      };
      [400, 1000, 2000, 3500].forEach((delay) => {
        setTimeout(() => {
          const cached = mediaCache[item.id] || item;
          const vol = cached.volume !== undefined ? cached.volume : 100;
          if (vol > 0) {
            sendYtCommand('unMute');
            sendYtCommand('setVolume', [vol]);
          } else {
            sendYtCommand('mute');
          }
          if (!cached.hidden) sendYtCommand('playVideo');
        }, delay);
      });
    }

    if (item.type === 'video') {
      const videoEl = document.getElementById('vid-' + item.id);
      if (videoEl) {
        // Снимаем беззвучный режим чуть позже — так надёжнее проходит автоплей.
        // Если объект уже скрыт — оставляем приглушённым.
        setTimeout(() => {
          if (!item.hidden) {
            videoEl.muted = false;
            videoEl.volume = (item.volume !== undefined ? item.volume : 0) / 100;
          }
        }, 300);

        // Если видео не зациклено — по окончании скрываем (та же система,
        // что и у фото): невидимо и без звука, но продолжает играть в фоне
        videoEl.addEventListener('ended', () => {
          if (!videoEl.loop && !item.hidden) {
            item.hidden = true;
            applyHiddenState(el, item);
          }
        });
      }
    }
  }
  applyPosition(el, item);
  applyCropTransform(el, item);
  el.style.zIndex = item.z || 0;
}

function updateMediaPosition(data) {
  const cached = mediaCache[data.id];
  if (cached) {
    cached.x = data.x;
    cached.y = data.y;
    cached.w = data.w;
    cached.h = data.h;
    if (data.zoom !== undefined) cached.zoom = data.zoom;
    if (data.offsetX !== undefined) cached.offsetX = data.offsetX;
    if (data.offsetY !== undefined) cached.offsetY = data.offsetY;
    if (data.cropW !== undefined) cached.cropW = data.cropW;
    if (data.cropH !== undefined) cached.cropH = data.cropH;
    if (data.fontScale !== undefined) cached.fontScale = data.fontScale;
    if (data.color !== undefined) cached.color = data.color;
    if (data.hidden !== undefined) cached.hidden = data.hidden;
    if (data.loop !== undefined) cached.loop = data.loop;
    if (data.volume !== undefined) cached.volume = data.volume;
    if (data.opacity !== undefined) cached.opacity = data.opacity;
    if (data.rotation !== undefined) cached.rotation = data.rotation;
  }
  const el = document.getElementById('m-' + data.id);
  if (el) {
    applyPosition(el, cached || data);
    applyCropTransform(el, cached || data);
  }
}

socket.on('add-media', createOrUpdateMedia);
socket.on('update-media', updateMediaPosition);
socket.on('update-media-batch', (updates) => {
  updates.forEach(updateMediaPosition);
});
socket.on('reorder-media', (idsInOrder) => {
  idsInOrder.forEach((id, idx) => {
    const z = idsInOrder.length - idx;
    const cached = mediaCache[id];
    if (cached) cached.z = z;
    const el = document.getElementById('m-' + id);
    if (el) el.style.zIndex = z;
  });
});

socket.on('remove-media', (id) => {
  const el = document.getElementById('m-' + id);
  if (el) el.remove();
  delete mediaCache[id];
});

socket.on('clear-media', () => {
  mediaLayer.innerHTML = '';
  for (const k in mediaCache) delete mediaCache[k];
});

// --- Управление YouTube ---
socket.on('youtube-control', (data) => {
  const iframe = document.getElementById('yt-' + data.id);
  if (!iframe || !iframe.contentWindow) return;
  let func = null, args = [];
  if (data.action === 'play') func = 'playVideo';
  else if (data.action === 'pause') func = 'pauseVideo';
  else if (data.action === 'volume') {
    const cached = mediaCache[data.id];
    if (cached) cached.volume = data.value;
    // 0 — выключаем звук полностью, иначе включаем и ставим громкость
    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: data.value > 0 ? 'unMute' : 'mute', args: [] }), '*');
    func = 'setVolume'; args = [data.value];
  }
  else if (data.action === 'seek' && typeof data.value === 'number') { func = 'seekTo'; args = [data.value, true]; }
  else if (data.action === 'mute') func = 'mute';
  else if (data.action === 'unmute') func = 'unMute';
  if (func) iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
});

// --- Управление браузер-источником (обновить страницу, как F5 в OBS) ---
socket.on('browser-control', (data) => {
  const frame = document.getElementById('browser-' + data.id);
  if (frame && data.action === 'reload') frame.src = frame.src;
});

// --- ТТС: фразы играются строго по очереди, по одной ---
// Обычный <audio>, а не speechSynthesis: так звук идёт через сам
// источник-браузер и OBS может его захватить
const ttsQueue = [];
let ttsAudio = null;

function playNextTts() {
  if (ttsAudio || ttsQueue.length === 0) return;
  const clip = ttsQueue.shift();
  const audio = new Audio(clip.url);
  audio.volume = (clip.volume !== undefined ? clip.volume : 80) / 100;
  audio.playbackRate = clip.rate || 1;
  ttsAudio = audio;
  const done = () => {
    if (ttsAudio !== audio) return;
    ttsAudio = null;
    playNextTts();
  };
  audio.addEventListener('ended', done);
  audio.addEventListener('error', done);
  audio.play().catch(done);
}

socket.on('tts', (clip) => {
  ttsQueue.push(clip);
  playNextTts();
});

socket.on('tts-stop', () => {
  ttsQueue.length = 0;
  if (ttsAudio) {
    ttsAudio.pause();
    ttsAudio = null;
  }
});

// --- Управление загруженным видео (play всегда сначала, pause) ---
socket.on('video-control', (data) => {
  const videoEl = document.getElementById('vid-' + data.id);
  if (!videoEl) return;
  if (data.action === 'restart') {
    const cached = mediaCache[data.id];
    if (cached) {
      cached.hidden = false;
      applyHiddenState(document.getElementById('m-' + data.id), cached);
    }
    videoEl.currentTime = 0;
    videoEl.play().catch(() => {});
  } else if (data.action === 'pause') {
    videoEl.pause();
  } else if (data.action === 'resume') {
    const cached = mediaCache[data.id];
    if (!cached || !cached.hidden) videoEl.play().catch(() => {});
  } else if (data.action === 'seek' && typeof data.time === 'number') {
    videoEl.currentTime = data.time;
  }
});
</script>
</body>
</html>
